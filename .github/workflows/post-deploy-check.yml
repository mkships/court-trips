# Runs web/scripts/smoke.mjs against every Vercel deployment as soon as it's built: key pages,
# all program pages, every photo, the /go hand-off and the 404 page.
#
# Vercel triggers it with a repository_dispatch event (vercel.deployment.ready fires after the
# deployment is created and before Deployment Checks run). The status step reports the result
# back to Vercel as "Vercel - courttrips: post-deploy-check"; add that under Vercel → Settings →
# Deployment Checks to hold production releases until it passes.
# Run it by hand from the Actions tab (workflow_dispatch) against any URL.
name: Post-deploy check

on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to check
        required: true
        default: https://courttrips.vercel.app

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    name: Post-deploy check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report status to Vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - courttrips: post-deploy-check"
      # checks out the deployment's own commit, so the script matches what was deployed
      - uses: vercel/repository-dispatch/actions/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check pages, photos and hand-off
        working-directory: web
        env:
          # passed through env, never interpolated into the shell
          DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
          # lets the check through Vercel's protection on preview deployments
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke.mjs "$DEPLOY_URL"
